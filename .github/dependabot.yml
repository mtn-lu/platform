version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      authentication:
        patterns: ["better-auth", "@better-auth/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      tooling:
        dependency-type: development
        exclude-patterns: ["wrangler", "@cloudflare/*", "@better-auth/*"]
      frontend:
        dependency-type: production
        exclude-patterns: ["better-auth", "@better-auth/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
