name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run types && npm run types:consumer
      - run: git diff --exit-code -- worker-configuration.d.ts tests/fixtures/consumer/worker-configuration.d.ts
      - run: npm run format:check && npm run typecheck && npm run lint
      - run: npm run db:migrate && npm run db:migrate && npm run email -- setup
      - run: npm run access -- grant friend@example.test && npm run access -- revoke friend@example.test
      - run: npm test && npm run test:node
      - run: npm audit
      - run: npm run build
      - run: npm run test:tls
      - name: Configure disposable test DNS
        run: echo '127.0.0.1 mtn.test games.mtn.test' | sudo tee -a /etc/hosts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Retain synthetic visual checks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: warn
